name: GFS to R2 (Multi Weather)

# NOAA GFS の最新サイクルを取得し Cloudflare R2 に配信する。
# GFS サイクル(00/06/12/18Z)の約5h後に実行。手動実行(workflow_dispatch)も可。
on:
  schedule:
    - cron: "0 5,17 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Build GFS binary and upload to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python gfs_update.py

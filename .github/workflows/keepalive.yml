name: Keepalive (scheduled workflows)

# 公開リポジトリは 60 日コミットが無いと schedule のワークフローを GitHub が止める。
# 天気比較の予報データ（GFS/ECMWF/ICON/GDPS/AIFS）の取り込みが黙って止まらないよう、
# 月 1 回だけ日付のファイルを書いてコミットする（2026-10-30・リポジトリ公開に合わせて追加）。
on:
  schedule:
    - cron: "17 4 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Touch keepalive file
        run: |
          date -u +%Y-%m-%dT%H:%M:%SZ > .keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git commit -m "keepalive $(date -u +%Y-%m)" || exit 0
          git push

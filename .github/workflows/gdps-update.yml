name: GDPS to R2 (Multi Weather)

# ECCC MSC Datamart の GDPS（0.15° 全球・00/12Z）を 3 時間刻み +120h で取得し R2 に gdps.* として配信する。
# 公開まで約 4〜5 時間。新着はディレクトリ一覧で探さない（利用方針）— find_cycle は既知のファイル名に HEAD。
# 手動実行(workflow_dispatch)も可。
on:
  schedule:
    - cron: "25 17 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    # 41ステップ×5変数（各 ~1MB）。float16 で約 1.2GB に詰めて上げる。
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Build GDPS binary and upload to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python gdps_update.py

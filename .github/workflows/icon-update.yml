name: ICON-EU to R2 (Multi Weather)

# DWD open data の ICON-EU（主サイクル 00/06/12/18Z・+120h）を取得し Cloudflare R2 に配信する。
# 公開まで約 3〜4 時間なので、その後に回す。手動実行(workflow_dispatch)も可。
# 名称・出典の扱いは monorepo の 10_Planning/ops_dwd_trademark_APP278269-B.md §4.5（DWD の書面）。
on:
  schedule:
    - cron: "40 4,10,16,22 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    # 93ステップ×5変数（bz2 で各 ~1MB）を取得して約 420MB に詰めて上げる。
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Build ICON-EU binary and upload to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python icon_update.py

name: ECMWF IFS to R2 (Multi Weather)

# ECMWF IFS open data の最新サイクルを取得し Cloudflare R2 に配信する。
# ECMWF は 00/06/12/18Z の約7〜9時間後に公開されるので、その後に回す。
# 手動実行(workflow_dispatch)も可。
on:
  schedule:
    - cron: "30 8,14,20,2 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    # 49ステップ×約4MBを取得して255MBに詰めて上げる。GFS より重いので長めに取る。
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Build ECMWF binary and upload to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python ecmwf_update.py

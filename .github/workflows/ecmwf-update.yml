name: ECMWF IFS to R2 (Multi Weather)

# ECMWF IFS open data の最新サイクルを取得し Cloudflare R2 に配信する。
# ECMWF は 00/06/12/18Z の約7〜9時間後に公開されるので、その後に回す。
# ★ 00Z の回だけ 08:30 UTC で 429 が続いた（2026-09-15〜17 三日連続）。公開直後の混雑を避けて 09:30 に。
# 手動実行(workflow_dispatch)も可。
on:
  schedule:
    - cron: "30 3,9,15,21 * * *"  # 全サイクル（2026-10-30 オーナー承認・公開リポジトリで Actions 無制限）
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    # 49ステップ×約4MBを取得して255MBに詰めて上げる。GFS より重いので長めに取る。
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Build ECMWF binary and upload to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python ecmwf_update.py
